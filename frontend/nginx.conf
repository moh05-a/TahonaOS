server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 30m;

  # Same-origin API so the HttpOnly refresh-token cookie works without CORS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Caching uses "expires" rather than add_header: an add_header inside a location would cancel
  # every security header declared for the server below.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback: the page itself is always revalidated.
  location / {
    expires -1;
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  # The app loads only its own scripts and styles; inline styles are used by the calendar and charts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
